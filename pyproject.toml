[project]
name = "dsl-spa"
version = "0.5.0"
authors = [
  { name="superwise-brian", email="brian.mcclannahan@superwise.ai" },
]
description = "A tool for building Structured Agentic Pipelines"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["setuptools >= 77.0.3","pandas >= 2.0.0","numpy >= 1.21.0","altair >= 5.3.0","SQLAlchemy >= 2.0.0"]

[project.optional-dependencies]
semantic-cache = ["langchain-openai>=0.3.3"]
dev = ["pytest>=7.0","langchain-openai>=0.3.3"]

[project.urls]
Homepage = "https://github.com/superwise-ai/dsl-spa"
Issues = "https://github.com/superwise-ai/dsl-spa/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"